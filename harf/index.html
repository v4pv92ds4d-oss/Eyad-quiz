<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مسابقة الحروف الزائدة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: classroom game show, lively but legible from the back row
   IDEA: a chalkboard on the wall; phones are answer pads with four coloured keys
   PICTURE: the live board itself (question, options, timer, fastest student)
   COLOUR+TYPE: chalkboard green field, cream chalk text, gold accent; Tajawal UI, Amiri for verses
   LAYOUT: screen = full-width board; phone = name card, then four stacked keys */
:root{--board:#1d4535;--board2:#163829;--chalk:#f6f1e4;--dim:#b9c7bc;--gold:#e7b343;--ink:#1c1a16;
  --o0:#d1553f;--o1:#2f6db5;--o2:#c9921c;--o3:#3c8a57;--r:18px}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--board);color:var(--chalk);font:18px/1.5 Tajawal,system-ui,sans-serif;overflow-x:clip}
button,input,select{font:inherit}
.hidden{display:none!important}
.ayah{font-family:Amiri,serif}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:#c0473a;vertical-align:middle}
.dot.on{background:#5fd38d}
.btn{border:0;border-radius:14px;padding:14px 26px;min-height:48px;background:var(--gold);color:var(--ink);font-weight:800;cursor:pointer}
.btn:focus-visible,.key:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn.ghost{background:transparent;color:var(--chalk);border:2px solid rgba(246,241,228,.35)}
.btn:disabled{opacity:.45;cursor:default}

/* ---------- HOST (screen) ---------- */
.host{min-height:100vh;display:flex;flex-direction:column;padding:22px clamp(18px,3vw,48px) 26px;gap:18px}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:16px;color:var(--dim)}
.topbar h1{margin:0;font-size:22px;color:var(--chalk);font-weight:800;margin-inline-end:auto}
.topbar .btn{padding:8px 16px;min-height:40px;font-size:15px}
.lobby{flex:1;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:start}
.hero h2{font-size:clamp(40px,5.5vw,76px);line-height:1.05;margin:10px 0 8px;font-weight:800}
.hero p{font-size:clamp(18px,1.8vw,24px);color:var(--dim);margin:0 0 22px}
.join{background:var(--chalk);color:var(--ink);border-radius:var(--r);padding:22px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
.join #qr{width:220px;height:220px;display:grid;place-items:center;font-size:14px;color:#666;text-align:center}
.join #qr img,.join #qr canvas{width:220px;height:220px}
.join .lnk{font-size:clamp(18px,1.7vw,24px);font-weight:700;word-break:break-all;direction:ltr;text-align:left}
.join .how{font-size:17px;color:#4a463f;margin:0 0 8px}
.roster{background:var(--board2);border-radius:var(--r);padding:20px;min-height:300px}
.roster h3{margin:0 0 12px;font-size:22px;display:flex;justify-content:space-between}
.roster h3 b{color:var(--gold);font-size:30px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:rgba(246,241,228,.1);border:1px solid rgba(246,241,228,.22);padding:6px 14px;border-radius:999px;font-size:18px;animation:pop .35s ease}
.empty{color:var(--dim);font-size:17px}
.setrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:20px}
.setrow label{color:var(--dim);font-size:17px}
.setrow select{background:var(--board2);color:var(--chalk);border:2px solid rgba(246,241,228,.3);border-radius:12px;padding:10px 12px;font-size:17px}
.start{font-size:24px;padding:16px 40px}

.stage{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px}
.qhead{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.qnum{background:var(--gold);color:var(--ink);font-weight:800;border-radius:999px;padding:6px 18px;font-size:20px}
.qtopic{color:var(--dim);font-size:19px}
.count{margin-inline-start:auto;font-size:20px;color:var(--dim)}
.count b{color:var(--chalk);font-size:28px}
.ring{--p:1;width:86px;height:86px;border-radius:50%;display:grid;place-items:center;font-size:32px;font-weight:800;
  background:conic-gradient(var(--gold) calc(var(--p)*360deg),rgba(246,241,228,.12) 0)}
.ring span{width:68px;height:68px;border-radius:50%;background:var(--board);display:grid;place-items:center}
.qbox{background:var(--chalk);color:var(--ink);border-radius:var(--r);padding:26px 30px;margin:16px 0 20px;box-shadow:0 10px 0 rgba(0,0,0,.18)}
.qbox .pr{font-size:clamp(22px,2.2vw,30px);font-weight:700;margin:0}
.qbox .ex{font-size:clamp(30px,3.4vw,48px);text-align:center;margin:10px 0 0;color:#5a341a;line-height:1.6}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.opt{--c:var(--o0);background:var(--c);border-radius:var(--r);padding:18px 20px;display:flex;align-items:center;gap:16px;font-size:clamp(20px,2vw,28px);font-weight:700;min-height:92px;position:relative;transition:opacity .3s,transform .3s}
.opt .L{flex:none;width:52px;height:52px;border-radius:12px;background:rgba(0,0,0,.22);display:grid;place-items:center;font-size:28px;font-weight:800}
.opt .n{margin-inline-start:auto;font-size:22px;background:rgba(0,0,0,.25);border-radius:10px;padding:2px 12px}
.opt.dim{opacity:.28}
.opt.right{transform:scale(1.02);box-shadow:0 0 0 5px var(--chalk)}
.side{background:var(--board2);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;align-self:start}
.side h3{margin:0 0 4px;font-size:20px;color:var(--dim)}
.lb{display:flex;flex-direction:column;gap:6px;list-style:none;margin:0;padding:0}
.lb li{display:flex;justify-content:space-between;gap:10px;background:rgba(246,241,228,.07);border-radius:10px;padding:8px 12px;font-size:18px}
.lb li b{color:var(--gold)}
.lb li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win{background:var(--gold);color:var(--ink);border-radius:var(--r);padding:16px 22px;font-size:clamp(22px,2.2vw,30px);font-weight:800;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:18px;animation:pop .4s ease}
.win small{font-weight:500;font-size:.7em}
.win .plus{margin-inline-start:auto;background:var(--ink);color:var(--gold);border-radius:12px;padding:4px 14px}
.win.none{background:rgba(246,241,228,.12);color:var(--chalk)}
.ctrl{display:flex;gap:12px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.ctrl .btn{font-size:21px}
.final{flex:1;display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
.final h2{font-size:clamp(36px,4.5vw,64px);margin:6px 0 0}
.podium{display:flex;align-items:flex-end;gap:16px;justify-content:center;width:min(820px,100%)}
.pod{flex:1;background:var(--chalk);color:var(--ink);border-radius:var(--r) var(--r) 0 0;padding:16px 10px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;animation:rise .7s ease both}
.pod .pl{font-size:42px;font-weight:800;color:#5a341a}
.pod .nm{font-size:24px;font-weight:800;overflow:hidden;text-overflow:ellipsis}
.pod .sc{font-size:18px;color:#5b574f}
.pod.p1{height:300px;background:var(--gold)}.pod.p2{height:230px}.pod.p3{height:180px}
.lb.rest{display:block;width:min(820px,100%);columns:2;column-gap:14px}
.rest li{break-inside:avoid;margin-bottom:6px}

/* ---------- PLAYER (phone) ---------- */
.pl-wrap{min-height:100vh;display:flex;flex-direction:column;padding:16px 16px 22px;gap:14px;max-width:560px;margin:0 auto}
.pl-top{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--dim)}
.pl-top .me{margin-inline-end:auto;color:var(--chalk);font-weight:700;font-size:17px}
.card{background:var(--chalk);color:var(--ink);border-radius:var(--r);padding:24px 20px}
.card h2{margin:0 0 6px;font-size:28px;line-height:1.2}
.card p{margin:0 0 16px;color:#4a463f}
.card input{width:100%;font-size:20px;padding:14px;border-radius:12px;border:2px solid #cfc6b4;margin-bottom:14px;background:#fff;color:var(--ink)}
.card .btn{width:100%;font-size:21px}
.wait{flex:1;display:grid;place-items:center;text-align:center}
.wait .big{font-size:30px;font-weight:800;line-height:1.3}
.wait .sub{color:var(--dim);font-size:18px;margin-top:8px}
.pulse{width:70px;height:70px;border-radius:50%;margin:0 auto 18px;background:var(--gold);animation:pulse 1.6s ease-in-out infinite}
.pq{display:flex;justify-content:space-between;align-items:center;font-size:18px}
.pq b{font-size:22px}
.bar{height:10px;background:rgba(246,241,228,.15);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);width:100%;transition:width .25s linear}
.keys{flex:1;display:grid;grid-template-rows:repeat(4,minmax(78px,1fr));gap:12px}
.key{--c:var(--o0);border:0;border-radius:var(--r);background:var(--c);color:#fff;display:flex;align-items:center;gap:14px;padding:14px 16px;font-size:21px;font-weight:700;text-align:right;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.25);transition:transform .08s,opacity .3s}
.key:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.key .L{flex:none;width:46px;height:46px;border-radius:12px;background:rgba(0,0,0,.22);display:grid;place-items:center;font-size:25px;font-weight:800}
.keys.locked .key{opacity:.3;cursor:default}
.keys.locked .key.mine{opacity:1;box-shadow:0 0 0 4px var(--chalk)}
.note{text-align:center;color:var(--dim);font-size:17px;min-height:26px}
.res{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:10px;border-radius:var(--r);padding:26px 18px}
.res .h{font-size:34px;font-weight:800;line-height:1.25}
.res .s{font-size:19px}
.res.good{background:#3c8a57}.res.best{background:var(--gold);color:var(--ink)}.res.bad{background:#a9442f}.res.none{background:var(--board2)}
.stat{display:flex;gap:12px}
.stat div{flex:1;background:var(--board2);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:30px;color:var(--gold)}
.link{background:none;border:0;color:var(--dim);text-decoration:underline;cursor:pointer;font-size:15px;padding:6px}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{0%,100%{transform:scale(.8);opacity:.6}50%{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:900px){.lobby,.stage{grid-template-columns:1fr}.join{grid-template-columns:1fr;justify-items:center}.opts{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
{
/* ================= الإعدادات =================
   TOPIC: قناة المزامنة العامة على ntfy.sh (بلا حساب). غيّرها إن أردت مسابقة منفصلة تمامًا.
   HOST_KEY: مفتاح شاشة المعلم: افتح الصفحة بـ ?host=HOST_KEY */
const TOPIC="ksu-harf-zaid-quiz-q7k3m9x2", HOST_KEY="harf1448";

/* ================= الأسئلة =================
   q: نص السؤال (يظهر على الشاشة فقط)، ex: الشاهد، o: الخيارات الأربعة، a: رقم الصحيح (0-3) */
const QS=[
 {t:"زيادة «أنْ»",q:"ما الحرف الزائد في قوله تعالى:",ex:"﴿فَلَمَّا أَنْ جَاءَ الْبَشِيرُ أَلْقَاهُ عَلَى وَجْهِهِ﴾",o:["لمّا","أنْ","الفاء","لا زائد فيها"],a:1},
 {t:"زيادة «أنْ»",q:"أكثر مواضع زيادة «أنْ» أن تقع:",ex:"",o:["بعد «ما» النافية","بين الكاف ومجرورها","بعد «لمّا» التوقيتية","بعد «ألا» الاستفتاحية"],a:2},
 {t:"زيادة «أنْ»",q:"ما «أنْ» في قولنا:",ex:"«واللهِ أنْ لو جئتَنا لأكرمناك»",o:["زائدة بين القسم و«لو»","مصدرية ناصبة","تفسيرية","مخففة من الثقيلة"],a:0},
 {t:"زيادة «لا»",q:"معنى قوله تعالى:",ex:"﴿لِئَلَّا يَعْلَمَ أَهْلُ الْكِتَابِ﴾",o:["كي لا يعلمَ أهلُ الكتاب","حتى لا يعلمَ أهلُ الكتاب","لم يعلمْ أهلُ الكتاب","لِيعلمَ أهلُ الكتاب"],a:3},
 {t:"زيادة «لا»",q:"ما فائدة «لا» في قوله تعالى:",ex:"﴿مَا مَنَعَكَ أَلَّا تَسْجُدَ﴾",o:["النهي","تقوية الكلام وتوكيده","النفي","العطف"],a:1},
 {t:"زيادة «إنْ»",q:"لماذا رُفع «قائمٌ» في قولنا:",ex:"«ما إنْ زيدٌ قائمٌ»",o:["لأن «إنْ» الزائدة كفّت «ما» عن العمل","لأن «ما» تعمل عمل ليس","لأن «إنْ» نافية عاملة","لأنه مبتدأ مؤخر"],a:0},
 {t:"زيادة «إنْ»",q:"أكثر ما تُزاد «إنْ» بعد:",ex:"",o:["«لمّا» التوقيتية","«لو»","«ما» النافية","حروف الجر"],a:2},
 {t:"«ما» بعد حروف الجر",q:"ما نوع «ما» في قوله تعالى:",ex:"﴿فَبِمَا نَقْضِهِمْ مِيثَاقَهُمْ﴾",o:["زائدة كافّة","موصولة","نافية","زائدة غير كافّة"],a:3},
 {t:"«ما» بعد حروف الجر",q:"ما نوع «ما» في قوله تعالى:",ex:"﴿رُبَمَا يَوَدُّ الَّذِينَ كَفَرُوا﴾",o:["زائدة كافّة","زائدة غير كافّة","مصدرية","نافية"],a:0},
 {t:"«ما» بعد حروف الجر",q:"تكون «ما» الزائدة كافّة غالبًا بعد:",ex:"",o:["«مِن» و«عن»","الباء و«مِن»","«رُبّ» والكاف","«عن» والباء"],a:2},
 {t:"زيادة «مِن»",q:"إعراب «ذِكْرٍ» في قوله تعالى:",ex:"﴿مَا يَأْتِيهِمْ مِنْ ذِكْرٍ مِنْ رَبِّهِمْ مُحْدَثٍ﴾",o:["مفعول به","فاعل مجرور لفظًا مرفوع محلًّا","اسم مجرور فقط","مبتدأ مؤخر"],a:1},
 {t:"زيادة «مِن»",q:"إعراب «أَحَدٍ» في قوله تعالى:",ex:"﴿هَلْ تُحِسُّ مِنْهُمْ مِنْ أَحَدٍ﴾",o:["فاعل مجرور لفظًا","بدل من الضمير","مفعول به مجرور لفظًا منصوب محلًّا","مبتدأ"],a:2},
 {t:"زيادة «مِن»",q:"إعراب «إِلَهٍ» في قوله تعالى:",ex:"﴿مَا لَكُمْ مِنْ إِلَهٍ غَيْرُهُ﴾",o:["خبر مقدّم","اسم «ما» الحجازية","فاعل","مبتدأ مؤخر مجرور لفظًا مرفوع محلًّا"],a:3},
 {t:"زيادة «مِن»",q:"في أيّ جملة «مِن» زائدة على الفصيح؟",ex:"",o:["ما جاءني مِن رجلٍ","جاءني مِن رجلٍ","ما جاءني مِن الرجلِ","خرجتُ مِن البيتِ"],a:0},
 {t:"زيادة «مِن»",q:"شرطا زيادة «مِن» على الفصيح:",ex:"",o:["الإثبات وتعريف المجرور","تقدّم نفي أو شبهه وتنكير المجرور","وقوعها أول الكلام","دخولها على الفعل"],a:1},
];
const LET=["أ","ب","ج","د"];

/* ================= أدوات ================= */
const QP=new URLSearchParams(location.search);
const MODE=QP.get("host")===HOST_KEY?"host":"player";
const BASE="https://ntfy.sh/"+TOPIC;
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const AR=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const sec=ms=>AR((ms/1000).toFixed(1)).replace(".","٫");
const rid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);
const st={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ================= النقل: ntfy.sh (أو BroadcastChannel للتجربة المحلية ?bc) ================= */
const net={ok:false,seen:new Set(),on:()=>{},status:()=>{}};
let bc=null;
function handle(m){
  if(!m||m.event!=="message"||net.seen.has(m.id))return;net.seen.add(m.id);
  let d;try{d=JSON.parse(m.message)}catch(e){return}
  if(d&&d.t)net.on(d,m);
}
function connect(since){
  if(QP.has("bc")){bc=new BroadcastChannel(TOPIC);bc.onmessage=e=>handle(e.data);net.ok=true;net.status();return;}
  let last=null,es=null;
  const take=m=>{if(m.event==="message"){last=m.id;handle(m)}};
  const open=()=>{try{es&&es.close()}catch(e){}
    es=new EventSource(BASE+"/sse?since="+(last||since));
    es.onopen=()=>{net.ok=true;net.status()};
    es.onmessage=ev=>{try{take(JSON.parse(ev.data))}catch(e){}};
    es.onerror=()=>{net.ok=false;net.status();es.close();setTimeout(open,2500)};};
  open();
  setInterval(()=>{if(net.ok)return;
    fetch(BASE+"/json?poll=1&since="+(last||since)).then(r=>r.text()).then(t=>t.split("\n").forEach(l=>{if(l.trim())try{take(JSON.parse(l))}catch(e){}})).catch(()=>{})},5000);
}
function pub(obj,tries=0){
  if(bc){bc.postMessage({id:rid(),event:"message",message:JSON.stringify(obj)});return Promise.resolve();}
  return fetch(BASE,{method:"POST",body:JSON.stringify(obj)}).then(r=>{if(!r.ok)throw new Error(r.status)})
    .catch(e=>{if(tries<4)return new Promise(r=>setTimeout(r,1200*(tries+1))).then(()=>pub(obj,tries+1));throw e});
}

/* ======================================================================
   شاشة المعلم
   ====================================================================== */
if(MODE==="host"){
  const KEY="harf-host-"+TOPIC;
  const fresh=secs=>({g:rid(),since:Math.floor(Date.now()/1000)-5,ph:"lobby",qi:-1,secs:secs||20,P:{},ord:[],list:[],openAt:0,dl:0,win:null});
  let H=st.get(KEY,null)||fresh();
  const save=()=>st.set(KEY,H);
  const playerURL=location.origin+location.pathname;
  const board=()=>H.ord.map(p=>({p,n:H.P[p].n,s:H.P[p].s})).sort((a,b)=>b.s-a.s||H.ord.indexOf(a.p)-H.ord.indexOf(b.p));
  const snap=()=>{const o={t:"st",g:H.g,ph:H.ph,qi:H.qi,n:QS.length,sc:board().slice(0,60).map(x=>[x.p,x.n,x.s])};
    if(H.ph==="q")o.rem=Math.max(0,H.dl-Date.now()),o.dur=H.secs*1000;
    if(H.ph==="r"){o.a=QS[H.qi].a;if(H.win)o.w=[H.win.p,H.P[H.win.p].n,H.win.ms];}
    return o;};
  let pubT=null;
  const sync=(delay=0)=>{clearTimeout(pubT);pubT=setTimeout(()=>pub(snap()).catch(()=>flash("تعذّر إرسال التحديث، تحقق من الإنترنت")),delay)};
  let flashMsg="";const flash=t=>{flashMsg=t;render();setTimeout(()=>{flashMsg="";render()},4000)};

  net.on=d=>{
    if(d.g&&d.g!==H.g)return;
    const name=String(d.n||"").trim().slice(0,24);
    if(d.t==="join"||d.t==="ans"){
      if(!d.p)return;
      if(!H.P[d.p]){if(!name)return;H.P[d.p]={n:name,s:0};H.ord.push(d.p);}
      else if(name)H.P[d.p].n=name;
    }
    if(d.t==="join"){save();render();if(H.ph==="lobby")sync(1500);return;}
    if(d.t==="ans"){
      if(H.ph!=="q"||d.q!==H.qi||H.list.some(x=>x.p===d.p))return;
      const k=d.k|0;if(k<0||k>3)return;
      const ms=Date.now()-H.openAt;H.list.push({p:d.p,k,ms});
      if(k===QS[H.qi].a&&!H.win)H.win={p:d.p,ms};
      save();
      if(H.list.length>=H.ord.length)reveal();else render();
    }
  };

  const openQ=i=>{H.ph="q";H.qi=i;H.list=[];H.win=null;H.openAt=Date.now();H.dl=H.openAt+H.secs*1000;save();sync();render();};
  const reveal=()=>{if(H.ph!=="q")return;H.ph="r";if(H.win)H.P[H.win.p].s+=1;save();sync();render();};
  const next=()=>{if(H.ph==="lobby")openQ(0);else if(H.ph==="q")reveal();else if(H.ph==="r"){if(H.qi<QS.length-1)openQ(H.qi+1);else{H.ph="end";save();sync();render();}}};
  const newGame=()=>{if(!confirm("بدء مسابقة جديدة؟ ستُمسح النتائج الحالية وعلى الطلاب الدخول من جديد."))return;H=fresh(H.secs);save();location.reload();};

  setInterval(()=>{if(H.ph!=="q")return;if(Date.now()>=H.dl)reveal();else tick();},250);
  document.addEventListener("keydown",e=>{if(e.target.tagName==="SELECT")return;if(e.code==="Space"||e.key==="Enter"||e.key==="ArrowLeft"){e.preventDefault();next();}});

  const top=()=>`<div class="topbar"><h1>مسابقة الحروف الزائدة</h1>
    <span><span class="dot${net.ok?" on":""}" id="hdot"></span> ${net.ok?"متصل":"يتصل…"}</span>
    ${flashMsg?`<span style="color:#ffb4a6">${esc(flashMsg)}</span>`:""}
    <span>رابط الطلاب: <b dir="ltr">${esc(playerURL.replace(/^https?:\/\//,""))}</b></span>
    <button class="btn ghost" id="bNew" type="button">مسابقة جديدة</button></div>`;
  const lbHTML=n=>{const b=board().slice(0,n);return b.length?`<ol class="lb">${b.map((x,i)=>`<li><span class="nm">${AR(i+1)}. ${esc(x.n)}</span><b>${AR(x.s)}</b></li>`).join("")}</ol>`:`<p class="empty">لا أحد بعد</p>`};
  const tick=()=>{const r=document.getElementById("ring");if(!r)return;const left=Math.max(0,H.dl-Date.now());
    r.style.setProperty("--p",left/(H.secs*1000));r.querySelector("span").textContent=AR(Math.ceil(left/1000));};

  function render(){
    let h=top();
    if(H.ph==="lobby"){
      const ppl=H.ord.map(p=>`<span class="chip">${esc(H.P[p].n)}</span>`).join("");
      h+=`<div class="lobby"><div class="hero">
        <h2>مسابقة السرعة:<br>الحروف الزائدة</h2>
        <p>لا · إنْ · أنْ · «ما» بعد حروف الجر · زيادة «مِن» — ${AR(QS.length)} سؤالًا، والأسرع بالإجابة الصحيحة يكسب النقطة</p>
        <div class="join"><div id="qr">يجري تحميل الرمز…</div><div>
          <p class="how">امسح الرمز بالجوال، أو افتح الرابط واكتب اسمك:</p>
          <div class="lnk">${esc(playerURL)}</div></div></div>
        <div class="setrow"><label for="secs">مدة كل سؤال</label>
          <select id="secs">${[10,15,20,30,45].map(s=>`<option value="${s}"${s===H.secs?" selected":""}>${AR(s)} ثانية</option>`).join("")}</select>
          <button class="btn start" id="bStart" type="button"${H.ord.length?"":" disabled"}>ابدأ المسابقة</button></div>
        </div>
        <div class="roster"><h3>الطلاب المنضمّون <b>${AR(H.ord.length)}</b></h3>
          <div class="chips">${ppl||`<p class="empty">بانتظار انضمام الطلاب…</p>`}</div></div></div>`;
    } else if(H.ph==="q"||H.ph==="r"){
      const Q=QS[H.qi],R=H.ph==="r";
      const cnt=[0,0,0,0];H.list.forEach(x=>cnt[x.k]++);
      const opts=Q.o.map((o,k)=>`<div class="opt${R?(k===Q.a?" right":" dim"):""}" style="--c:var(--o${k})"><span class="L">${LET[k]}</span><span>${esc(o)}</span>${R?`<span class="n">${AR(cnt[k])}</span>`:""}</div>`).join("");
      let winHTML="";
      if(R){if(H.win){const w=H.win,fast=H.list.filter(x=>x.k===Q.a).slice(1,3).map(x=>`${esc(H.P[x.p].n)} (${sec(x.ms)} ث)`).join("، ");
          winHTML=`<div class="win">الأسرع: ${esc(H.P[w.p].n)} <small>${sec(w.ms)} ثانية${fast?` · ثم: ${fast}`:""}</small><span class="plus">+١</span></div>`;}
        else winHTML=`<div class="win none">لم يُجب أحد إجابة صحيحة</div>`;}
      h+=`<div class="stage"><div>
        <div class="qhead"><span class="qnum">السؤال ${AR(H.qi+1)} من ${AR(QS.length)}</span><span class="qtopic">${esc(Q.t)}</span>
          <span class="count">أجاب <b>${AR(H.list.length)}</b> من ${AR(H.ord.length)}</span>
          ${R?"":`<div class="ring" id="ring"><span></span></div>`}</div>
        <div class="qbox"><p class="pr">${esc(Q.q)}</p>${Q.ex?`<p class="ex ayah">${esc(Q.ex)}</p>`:""}</div>
        <div class="opts">${opts}</div>${winHTML}
        <div class="ctrl"><button class="btn" id="bNext" type="button">${R?(H.qi<QS.length-1?"السؤال التالي":"النتائج النهائية"):"أظهر الإجابة"}</button></div>
      </div><aside class="side"><h3>الترتيب</h3>${lbHTML(10)}</aside></div>`;
    } else {
      const b=board(),p=[b[1],b[0],b[2]];
      h+=`<div class="final"><h2>النتائج النهائية</h2><div class="podium">${p.map((x,i)=>x?`<div class="pod p${[2,1,3][i]}"><span class="pl">${AR([2,1,3][i])}</span><span class="nm">${esc(x.n)}</span><span class="sc">${AR(x.s)} نقطة</span></div>`:`<div class="pod p${[2,1,3][i]}" style="visibility:hidden"></div>`).join("")}</div>
        ${b.length>3?`<ol class="lb rest" start="4">${b.slice(3).map((x,i)=>`<li><span class="nm">${AR(i+4)}. ${esc(x.n)}</span><b>${AR(x.s)}</b></li>`).join("")}</ol>`:""}
        <button class="btn" id="bNew2" type="button">مسابقة جديدة</button></div>`;
    }
    app.innerHTML=`<div class="host">${h}</div>`;
    const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f};
    on("bStart",next);on("bNext",next);on("bNew",newGame);on("bNew2",newGame);
    const s=document.getElementById("secs");if(s)s.onchange=()=>{H.secs=+s.value;save()};
    const q=document.getElementById("qr");
    if(q){try{q.innerHTML="";new QRCode(q,{text:playerURL,width:220,height:220,correctLevel:QRCode.CorrectLevel.M})}catch(e){q.textContent="تعذّر تحميل الرمز؛ استخدم الرابط"}}
    tick();
  }
  net.status=()=>{const d=document.getElementById("hdot");if(d){d.classList.toggle("on",net.ok);d.nextSibling.textContent=net.ok?" متصل":" يتصل…"}};
  connect(H.since);render();
  sync(800);
}

/* ======================================================================
   جوال الطالب
   ====================================================================== */
if(MODE==="player"){
  const KEY="harf-me-"+TOPIC+(QP.get("id")||"");
  let me=st.get(KEY,null)||{p:rid(),n:"",g:null,picks:{}};
  const save=()=>st.set(KEY,me);
  let S=null,recv=0,editing=!me.n,sending=false,tmr=null;

  const join=()=>{if(!me.n)return;me.g=S?S.g:null;save();pub({t:"join",g:S?S.g:"",p:me.p,n:me.n}).catch(()=>{})};
  /* messages replayed from the server's cache arrive in a burst: settle on the latest state, then join once */
  let settleT=null,rT=null;
  const settle=()=>{if(!S)return;if(me.g!==S.g){me.picks={};save();if(me.n&&!editing)join();}render();};
  net.on=(d,m)=>{
    if(d.t!=="st")return;
    S=d;
    const age=m&&m.time?Date.now()-m.time*1000:0;
    recv=age>3000?m.time*1000:Date.now();
    clearTimeout(settleT);settleT=setTimeout(settle,400);
  };
  const pick=k=>{
    if(!S||S.ph!=="q"||me.picks[S.qi]!==undefined)return;
    if(Date.now()-recv>=S.rem)return;
    me.picks[S.qi]=k;save();sending=true;render();
    pub({t:"ans",g:S.g,p:me.p,n:me.n,q:S.qi,k}).then(()=>{sending=false;render()}).catch(()=>{sending=false;delete me.picks[S.qi];save();render();note("تعذّر الإرسال، حاول مرة أخرى")});
  };
  let noteMsg="";const note=t=>{noteMsg=t;render();setTimeout(()=>{noteMsg="";render()},3500)};
  const myRank=()=>{if(!S||!S.sc)return null;const i=S.sc.findIndex(x=>x[0]===me.p);return i<0?null:{r:i+1,s:S.sc[i][2],of:S.sc.length}};

  function render(){
    clearInterval(tmr);
    const head=`<div class="pl-top"><span class="me">${me.n?esc(me.n):"مسابقة الحروف الزائدة"}</span><span class="dot${net.ok?" on":""}" id="pdot"></span></div>`;
    let h="";
    if(editing||!me.n){
      h=`<div style="flex:1;display:grid;align-content:center"><form class="card" id="f">
        <h2>مسابقة الحروف الزائدة</h2><p>اكتب اسمك كما تحب أن يظهر على الشاشة.</p>
        <input id="nm" maxlength="24" autocomplete="off" placeholder="الاسم" value="${esc(me.n)}" required>
        <button class="btn" type="submit">دخول المسابقة</button></form></div>`;
    } else if(!S||S.ph==="lobby"){
      h=`<div class="wait"><div><div class="pulse"></div><div class="big">أهلًا يا ${esc(me.n)}</div>
        <div class="sub">${S?"تم تسجيلك. انتظر حتى يبدأ المعلم المسابقة.":"بانتظار فتح المسابقة من شاشة المعلم…"}</div>
        <button class="link" id="chg" type="button">تغيير الاسم</button></div></div>`;
    } else if(S.ph==="q"){
      const Q=QS[S.qi],mine=me.picks[S.qi],left=Math.max(0,S.rem-(Date.now()-recv)),over=left<=0;
      const locked=mine!==undefined||over;
      h=`<div class="pq"><span>السؤال <b>${AR(S.qi+1)}</b> من ${AR(S.n)}</span><span id="secs">${AR(Math.ceil(left/1000))} ث</span></div>
        <div class="bar"><i id="tb" style="width:${(left/S.dur)*100}%"></i></div>
        <div class="keys${locked?" locked":""}">${Q.o.map((o,k)=>`<button class="key${mine===k?" mine":""}" style="--c:var(--o${k})" data-k="${k}" type="button"${locked?" disabled":""}><span class="L">${LET[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
        <div class="note">${noteMsg?esc(noteMsg):mine!==undefined?(sending?"جارٍ الإرسال…":"أُرسلت إجابتك، انظر إلى الشاشة"):over?"انتهى الوقت":"اقرأ السؤال على الشاشة واختر بسرعة"}</div>`;
    } else if(S.ph==="r"){
      const mine=me.picks[S.qi],ok=mine===S.a,best=S.w&&S.w[0]===me.p,rk=myRank();
      const cls=mine===undefined?"none":best?"best":ok?"good":"bad";
      const hd=mine===undefined?"لم تُجب عن هذا السؤال":best?"أنت الأسرع! +١":ok?"إجابة صحيحة":"إجابة خاطئة";
      const sb=best?`أجبت في ${sec(S.w[2])} ثانية`:ok&&S.w?`لكن سبقك ${esc(S.w[1])}`:mine!==undefined&&!ok?`الصحيح: ${LET[S.a]}) ${esc(QS[S.qi].o[S.a])}`:"";
      h=`<div class="res ${cls}"><div class="h">${hd}</div><div class="s">${sb}</div></div>
        <div class="stat"><div><b>${rk?AR(rk.s):"٠"}</b>نقاطك</div><div><b>${rk?AR(rk.r):"—"}</b>ترتيبك من ${rk?AR(rk.of):"—"}</div></div>
        <div class="note">انتظر السؤال التالي…</div>`;
    } else {
      const rk=myRank(),t3=(S.sc||[]).slice(0,3);
      h=`<div class="res best"><div class="h">انتهت المسابقة</div><div class="s">${rk?`ترتيبك ${AR(rk.r)} من ${AR(rk.of)} — ${AR(rk.s)} نقطة`:""}</div></div>
        <div class="card"><h2 style="font-size:22px">الثلاثة الأوائل</h2><ol class="lb" style="color:var(--chalk)">${t3.map((x,i)=>`<li style="background:var(--board)"><span class="nm">${AR(i+1)}. ${esc(x[1])}</span><b>${AR(x[2])}</b></li>`).join("")}</ol></div>`;
    }
    app.innerHTML=`<div class="pl-wrap">${head}${h}</div>`;
    const f=document.getElementById("f");
    if(f){const i=document.getElementById("nm");if(!me.n)i.focus();
      f.onsubmit=e=>{e.preventDefault();const v=i.value.trim().slice(0,24);if(!v)return;me.n=v;editing=false;save();join();render();};}
    const c=document.getElementById("chg");if(c)c.onclick=()=>{editing=true;render()};
    app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
    if(S&&S.ph==="q"&&!editing){tmr=setInterval(()=>{const left=Math.max(0,S.rem-(Date.now()-recv));
      const s=document.getElementById("secs"),b=document.getElementById("tb");if(s)s.textContent=AR(Math.ceil(left/1000))+" ث";if(b)b.style.width=(left/S.dur)*100+"%";
      if(left<=0&&me.picks[S.qi]===undefined)render();},250);}
  }
  net.status=()=>{const d=document.getElementById("pdot");if(d)d.classList.toggle("on",net.ok)};
  connect("all");render();
  if(me.n)setTimeout(()=>{if(!S)join()},1500);
}
}
</script>
</body>
